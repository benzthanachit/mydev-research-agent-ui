<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" style="image-rendering: pixelated;">
  <!-- The Editor Cat (Agent 5 - Cat 3) Pixel Art Sprite -->
  <!-- Cute Purple/Violet Cat with a golden pencil -->
  
  <!-- Back / Tail -->
  <rect x="2" y="15" width="2" height="7" fill="#6f4e7c" />
  <rect x="4" y="14" width="2" height="2" fill="#967bb6" />

  <!-- Body (Violet/Lavender) -->
  <rect x="6" y="12" width="16" height="13" fill="#967bb6" />
  
  <!-- Purple Stripes/Spots -->
  <rect x="9" y="12" width="2" height="5" fill="#6f4e7c" />
  <rect x="13" y="12" width="2" height="5" fill="#6f4e7c" />
  <rect x="17" y="12" width="2" height="5" fill="#6f4e7c" />
  
  <!-- Chest (White bib) -->
  <rect x="19" y="14" width="3" height="6" fill="#ffffff" />
  
  <!-- Paws (Lavender with white socks) -->
  <rect x="6" y="25" width="2" height="3" fill="#ffffff" />
  <rect x="9" y="25" width="2" height="3" fill="#967bb6" />
  <rect x="15" y="25" width="2" height="3" fill="#ffffff" />
  <rect x="18" y="25" width="2" height="3" fill="#967bb6" />

  <!-- Head -->
  <rect x="15" y="4" width="11" height="9" fill="#967bb6" />
  
  <!-- Ears -->
  <rect x="16" y="1" width="2" height="3" fill="#967bb6" />
  <rect x="23" y="1" width="2" height="3" fill="#967bb6" />
  <!-- Ear insides -->
  <rect x="17" y="2" width="1" height="2" fill="#ff9eb5" />
  <rect x="23" y="2" width="1" height="2" fill="#ff9eb5" />
  
  <!-- Eyes (Smart Green) -->
  <rect x="18" y="7" width="2" height="2" fill="#76946a" />
  <rect x="23" y="7" width="2" height="2" fill="#76946a" />
  <!-- Pupils -->
  <rect x="19" y="7" width="1" height="2" fill="#000000" />
  <rect x="24" y="7" width="1" height="2" fill="#000000" />
  
  <!-- Snout -->
  <rect x="20" y="9" width="4" height="2" fill="#ffffff" />
  <rect x="22" y="9" width="1" height="1" fill="#ff9eb5" /> <!-- Nose -->

  <!-- Golden Pencil in hand -->
  <rect x="23" y="16" width="2" height="4" fill="#ffd700" /> <!-- Gold lead base -->
  <rect x="25" y="12" width="2" height="5" fill="#ffae19" /> <!-- Golden pencil body -->
  <rect x="26" y="8" width="1" height="5" fill="#e59400" />
  <rect x="24" y="20" width="2" height="1" fill="#ff4d4d" /> <!-- Pink eraser top -->
</svg>
