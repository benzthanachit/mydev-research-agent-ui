<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="100%" height="100%" preserveAspectRatio="none" style="image-rendering: pixelated;">
  <!-- Retro RPG Cat Office Background (120x60 grid) -->
  
  <!-- Brick Wall Background (Dark slate/purple bricks) -->
  <rect x="0" y="0" width="120" height="40" fill="#1c1d27" />
  
  <!-- Brick Grid (horizontal lines) -->
  <line x1="0" y1="5" x2="120" y2="5" stroke="#13141c" stroke-width="0.5" stroke-dasharray="8 4" />
  <line x1="0" y1="10" x2="120" y2="10" stroke="#13141c" stroke-width="0.5" stroke-dasharray="4 8" />
  <line x1="0" y1="15" x2="120" y2="15" stroke="#13141c" stroke-width="0.5" stroke-dasharray="8 4" />
  <line x1="0" y1="20" x2="120" y2="20" stroke="#13141c" stroke-width="0.5" stroke-dasharray="4 8" />
  <line x1="0" y1="25" x2="120" y2="25" stroke="#13141c" stroke-width="0.5" stroke-dasharray="8 4" />
  <line x1="0" y1="30" x2="120" y2="30" stroke="#13141c" stroke-width="0.5" stroke-dasharray="4 8" />
  <line x1="0" y1="35" x2="120" y2="35" stroke="#13141c" stroke-width="0.5" stroke-dasharray="8 4" />

  <!-- Cozy Oak Wooden Floor (bottom 1/3) -->
  <rect x="0" y="40" width="120" height="20" fill="#4d2f1d" />
  <!-- Floorboards (horizontal lines and joint details) -->
  <line x1="0" y1="44" x2="120" y2="44" stroke="#362013" stroke-width="0.8" />
  <line x1="0" y1="48" x2="120" y2="48" stroke="#362013" stroke-width="0.8" />
  <line x1="0" y1="52" x2="120" y2="52" stroke="#362013" stroke-width="0.8" />
  <line x1="0" y1="56" x2="120" y2="56" stroke="#362013" stroke-width="0.8" />
  
  <!-- Floorboard seams -->
  <line x1="15" y1="40" x2="15" y2="44" stroke="#362013" stroke-width="0.5" />
  <line x1="45" y1="40" x2="45" y2="44" stroke="#362013" stroke-width="0.5" />
  <line x1="85" y1="40" x2="85" y2="44" stroke="#362013" stroke-width="0.5" />
  
  <line x1="30" y1="44" x2="30" y2="48" stroke="#362013" stroke-width="0.5" />
  <line x1="70" y1="44" x2="70" y2="48" stroke="#362013" stroke-width="0.5" />
  <line x1="105" y1="44" x2="105" y2="48" stroke="#362013" stroke-width="0.5" />
  
  <line x1="20" y1="48" x2="20" y2="52" stroke="#362013" stroke-width="0.5" />
  <line x1="55" y1="48" x2="55" y2="52" stroke="#362013" stroke-width="0.5" />
  <line x1="90" y1="48" x2="90" y2="52" stroke="#362013" stroke-width="0.5" />

  <!-- Back bookshelves (wooden frames containing colorful books) -->
  <!-- Bookshelf 1 (Left side) -->
  <rect x="5" y="8" width="22" height="32" fill="#6d4c31" stroke="#3d2818" stroke-width="1" />
  <rect x="7" y="10" width="18" height="8" fill="#3d2818" />
  <rect x="7" y="20" width="18" height="8" fill="#3d2818" />
  <rect x="7" y="30" width="18" height="8" fill="#3d2818" />
  <!-- Shelf lines -->
  <line x1="5" y1="19" x2="27" y2="19" stroke="#6d4c31" stroke-width="1" />
  <line x1="5" y1="29" x2="27" y2="29" stroke="#6d4c31" stroke-width="1" />
  
  <!-- Bookshelf 1: Books (colored rectangles) -->
  <!-- Top shelf books -->
  <rect x="8" y="12" width="2" height="6" fill="#ff5d62" />
  <rect x="10" y="11" width="3" height="7" fill="#7e9cd8" />
  <rect x="13" y="13" width="2" height="5" fill="#e6c387" />
  <rect x="16" y="12" width="2" height="6" fill="#76946a" />
  <rect x="19" y="14" width="3" height="4" fill="#a0a2b5" /> <!-- Folded manuscripts -->
  
  <!-- Middle shelf books -->
  <rect x="8" y="22" width="3" height="6" fill="#76946a" />
  <rect x="12" y="21" width="2" height="7" fill="#e6c387" />
  <rect x="15" y="23" width="2" height="5" fill="#ff5d62" />
  <rect x="18" y="22" width="3" height="6" fill="#7e9cd8" />
  <rect x="22" y="24" width="2" height="4" fill="#888888" />
  
  <!-- Bottom shelf books -->
  <rect x="8" y="32" width="2" height="6" fill="#e6c387" />
  <rect x="11" y="32" width="3" height="6" fill="#7e9cd8" />
  <rect x="15" y="31" width="2" height="7" fill="#76946a" />
  <rect x="18" y="32" width="3" height="6" fill="#ff5d62" />
  
  <!-- Bookshelf 2 (Right side) -->
  <rect x="93" y="8" width="22" height="32" fill="#6d4c31" stroke="#3d2818" stroke-width="1" />
  <rect x="95" y="10" width="18" height="8" fill="#3d2818" />
  <rect x="95" y="20" width="18" height="8" fill="#3d2818" />
  <rect x="95" y="30" width="18" height="8" fill="#3d2818" />
  <!-- Shelf lines -->
  <line x1="93" y1="19" x2="115" y2="19" stroke="#6d4c31" stroke-width="1" />
  <line x1="93" y1="29" x2="115" y2="29" stroke="#6d4c31" stroke-width="1" />
  
  <!-- Bookshelf 2: Books -->
  <rect x="96" y="12" width="2" height="6" fill="#7e9cd8" />
  <rect x="98" y="11" width="3" height="7" fill="#ff5d62" />
  <rect x="102" y="12" width="2" height="6" fill="#76946a" />
  <rect x="105" y="13" width="3" height="5" fill="#e6c387" />
  
  <rect x="96" y="22" width="3" height="6" fill="#e6c387" />
  <rect x="100" y="21" width="2" height="7" fill="#7e9cd8" />
  <rect x="103" y="23" width="3" height="5" fill="#76946a" />
  <rect x="107" y="22" width="2" height="6" fill="#ff5d62" />
  
  <rect x="96" y="32" width="3" height="6" fill="#76946a" />
  <rect x="100" y="32" width="2" height="6" fill="#ff5d62" />
  <rect x="103" y="31" width="3" height="7" fill="#e6c387" />
  <rect x="107" y="32" width="2" height="6" fill="#7e9cd8" />

  <!-- Retro CRT Monitor Setup (Scribe desk - middle left) -->
  <rect x="38" y="25" width="22" height="15" fill="#34374c" stroke="#262837" stroke-width="1" /> <!-- Desk -->
  <rect x="42" y="28" width="2" height="6" fill="#717385" /> <!-- Monitor stand -->
  <rect x="39" y="33" width="8" height="1" fill="#717385" />
  <!-- Monitor frame -->
  <rect x="43" y="18" width="12" height="10" fill="#a0a2b5" rx="1" />
  <!-- CRT Screen (Terminal green) -->
  <rect x="45" y="20" width="8" height="6" fill="#0b0c10" />
  <rect x="46" y="21" width="3" height="1" fill="#36a374" /> <!-- Text lines -->
  <rect x="46" y="23" width="5" height="1" fill="#36a374" />
  <rect x="46" y="25" width="2" height="1" fill="#36a374" />
  
  <!-- Desk Lamp (Glowing warm yellow amber) -->
  <rect x="56" y="21" width="1" height="4" fill="#e6c387" /> <!-- lamp rod -->
  <path d="M 54,20 L 59,20 L 61,22 L 52,22 Z" fill="#ff5d62" /> <!-- shade -->
  <!-- Glowing light beam (semi-transparent) -->
  <polygon points="56,22 48,27 64,27" fill="#e6c387" opacity="0.3" />

  <!-- Retro Reviewer Desk (Middle right) -->
  <rect x="68" y="25" width="20" height="15" fill="#34374c" stroke="#262837" stroke-width="1" /> <!-- Desk -->
  <!-- Faded parchment scrolls, coffee mug, paper pile -->
  <rect x="71" y="22" width="4" height="3" fill="#ff5d62" /> <!-- Mug -->
  <rect x="72" y="21" width="1" height="1" fill="#ffffff" opacity="0.4" /> <!-- Coffee Steam -->
  <!-- Stack of manuscript paper -->
  <rect x="77" y="21" width="8" height="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="0.5" />
  <line x1="79" y1="22" x2="83" y2="22" stroke="#bbbbbb" stroke-width="0.5" />
  <line x1="78" y1="23" x2="84" y2="23" stroke="#bbbbbb" stroke-width="0.5" />
  <line x1="79" y1="24" x2="82" y2="24" stroke="#bbbbbb" stroke-width="0.5" />
  
  <!-- Retro Floor Rug -->
  <ellipse cx="60" cy="50" rx="25" ry="5" fill="#7e9cd8" opacity="0.7" />
  <ellipse cx="60" cy="50" rx="22" ry="3.5" fill="#5c78b0" opacity="0.7" />
</svg>
