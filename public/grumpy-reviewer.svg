<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" style="image-rendering: pixelated;">
  <!-- Grumpy Reviewer (Agent 3) Pixel Art Sprite -->
  <!-- Tuxedo Cat with Academic Mortarboard Cap -->
  
  <!-- Back / Tail -->
  <rect x="2" y="15" width="2" height="7" fill="#181920" />
  <rect x="4" y="14" width="2" height="2" fill="#181920" />

  <!-- Body (Black & White Tuxedo) -->
  <rect x="6" y="12" width="16" height="13" fill="#1c1d27" />
  
  <!-- White Tuxedo Chest -->
  <rect x="15" y="12" width="7" height="11" fill="#ffffff" />
  
  <!-- Paws (White boots) -->
  <rect x="6" y="25" width="2" height="3" fill="#ffffff" />
  <rect x="9" y="25" width="2" height="3" fill="#ffffff" />
  <rect x="15" y="25" width="2" height="3" fill="#ffffff" />
  <rect x="18" y="25" width="2" height="3" fill="#ffffff" />

  <!-- Head (Black with white chevron face mask) -->
  <rect x="15" y="5" width="11" height="9" fill="#1c1d27" />
  
  <!-- White Snout / Cheek chevron -->
  <rect x="19" y="10" width="5" height="3" fill="#ffffff" />
  <rect x="21" y="9" width="1" height="1" fill="#ffffff" />
  <rect x="21" y="10" width="1" height="1" fill="#ff5d62" /> <!-- Grumpy red nose -->
  
  <!-- Frowning Eyes (Yellow/Reddish glowing review eyes) -->
  <rect x="18" y="7" width="2" height="1" fill="#e6c387" />
  <rect x="23" y="7" width="2" height="1" fill="#e6c387" />
  <!-- Slanted Frown Eyebrows (Black) -->
  <rect x="17" y="6" width="3" height="1" fill="#111219" />
  <rect x="23" y="6" width="3" height="1" fill="#111219" />
  <!-- Pupils (Angry narrow slits) -->
  <rect x="19" y="7" width="1" height="1" fill="#000000" />
  <rect x="24" y="7" width="1" height="1" fill="#000000" />
  
  <!-- Whiskers pointing downwards (angry) -->
  <line x1="16" y1="11" x2="13" y2="13" stroke="#ffffff" stroke-width="0.5" />
  <line x1="26" y1="11" x2="29" y2="13" stroke="#ffffff" stroke-width="0.5" />
  
  <!-- Ears -->
  <rect x="16" y="2" width="2" height="3" fill="#1c1d27" />
  <rect x="23" y="2" width="2" height="3" fill="#1c1d27" />
  <rect x="17" y="3" width="1" height="2" fill="#ff9eb5" />
  
  <!-- Academic Mortarboard Cap (Flat diamond on top, yellow tassel) -->
  <polygon points="13,3 27,3 29,1 15,1" fill="#0b0c10" />
  <rect x="19" y="3" width="3" height="1" fill="#0b0c10" />
  <rect x="25" y="3" width="1" height="3" fill="#e6c387" /> <!-- Yellow tassel -->
  <circle cx="25.5" cy="6" r="0.8" fill="#e6c387" />
</svg>
