<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" style="image-rendering: pixelated;">
  <!-- Siamese Cat (แมววิเชียรมาศ) Pixel Art Sprite -->
  <!-- 32x32 grid -->
  
  <!-- Tail -->
  <rect x="2" y="16" width="2" height="6" fill="#4a3325" />
  <rect x="4" y="14" width="2" height="4" fill="#4a3325" />
  <rect x="6" y="18" width="2" height="2" fill="#4a3325" />
  
  <!-- Body Beige -->
  <rect x="8" y="14" width="14" height="10" fill="#e5d4b3" />
  <!-- Underbelly lighter shadow -->
  <rect x="10" y="22" width="10" height="2" fill="#d3be97" />
  
  <!-- Dark Paws (Points) -->
  <rect x="8" y="24" width="2" height="4" fill="#4a3325" />
  <rect x="11" y="24" width="2" height="4" fill="#38251a" />
  <rect x="16" y="24" width="2" height="4" fill="#4a3325" />
  <rect x="19" y="24" width="2" height="4" fill="#38251a" />
  
  <!-- Back Shading / Saddle (Darker points) -->
  <rect x="8" y="14" width="6" height="3" fill="#cfbd9b" />
  <rect x="14" y="15" width="4" height="2" fill="#cfbd9b" />
  
  <!-- Neck and collar -->
  <rect x="18" y="12" width="4" height="3" fill="#e5d4b3" />
  <rect x="18" y="14" width="4" height="1" fill="#ff5d62" /> <!-- Red collar -->
  <circle cx="20" cy="15.5" r="1" fill="#e6c387" /> <!-- Gold bell -->

  <!-- Head -->
  <rect x="17" y="5" width="10" height="8" fill="#e5d4b3" />
  
  <!-- Face Mask (Dark brown) -->
  <rect x="20" y="7" width="7" height="6" fill="#4a3325" />
  <rect x="22" y="6" width="4" height="1" fill="#4a3325" />
  
  <!-- Ears -->
  <rect x="18" y="2" width="2" height="3" fill="#4a3325" />
  <rect x="25" y="2" width="2" height="3" fill="#4a3325" />
  <!-- Ear insides (pink) -->
  <rect x="19" y="3" width="1" height="2" fill="#ff9eb5" />
  <rect x="25" y="3" width="1" height="2" fill="#ff9eb5" />
  
  <!-- Eyes (Vivid Blue) -->
  <rect x="21" y="8" width="2" height="2" fill="#3fc1c9" />
  <rect x="25" y="8" width="2" height="2" fill="#3fc1c9" />
  <!-- Eye Pupils -->
  <rect x="22" y="8" width="1" height="2" fill="#0b0c10" />
  <rect x="26" y="8" width="1" height="2" fill="#0b0c10" />
  
  <!-- Snout / Nose -->
  <rect x="24" y="10" width="2" height="1" fill="#1c100b" />
  <!-- Whiskers -->
  <rect x="27" y="10" width="3" height="1" fill="#ffffff" opacity="0.7" />
  <rect x="16" y="10" width="3" height="1" fill="#ffffff" opacity="0.7" />
</svg>
